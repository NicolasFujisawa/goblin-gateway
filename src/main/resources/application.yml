server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: goblin-payment
              uri: ${GOBLIN_PAYMENT:http://localhost:8081}
              predicates:
                - Path=/goblin-payment/**
              filters:
                - StripPrefix=1
            - id: goblin-assistant
              uri: ${GOBLIN_ASSISTANT:http://localhost:8082}
              predicates:
                - Path=/goblin-assistant/**
              filters:
                - StripPrefix=1
            - id: goblin-game-engine
              uri: ${GOBLIN_GAME_ENGINE:http://localhost:8083}
              predicates:
                - Path=/goblin-game-engine/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    kubernetes:
      enabled: true
